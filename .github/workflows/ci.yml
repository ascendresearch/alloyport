name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # Both boundary scripts refuse to run without ripgrep, and the runner image does not carry it.
      # Until this line existed they exited 2 on every push, so neither gate had ever evaluated
      # anything in CI — see docs/evidence/boundary-gates-red-20260817.md.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: rg --version
      - run: cargo fmt --check
      - run: bash scripts/check_sql_boundaries.sh
      - run: bash scripts/check_architecture_boundaries.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace --locked

  portable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: scripts/build_portable_linux_binaries.sh
