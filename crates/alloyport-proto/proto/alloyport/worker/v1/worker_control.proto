syntax = "proto3";

package alloyport.worker.v1;

service WorkerControl {
  rpc OpenControlStream(stream WorkerToServer) returns (stream ServerToWorker);
}

message WorkerToServer {
  uint64 sequence = 1;
  uint64 acknowledges_server_through = 2;
  // Stable across reconnects for durable lifecycle messages. Empty for hello and heartbeat.
  string message_id = 3;

  oneof message {
    WorkerHello hello = 10;
    Heartbeat heartbeat = 11;
    AssignmentAccepted assignment_accepted = 12;
    AssignmentRejected assignment_rejected = 13;
    ExecutionStarted execution_started = 14;
    OutputChunk output_chunk = 15;
    ExecutionFinished execution_finished = 16;
    WorkerStatus status = 17;
    CancellationAcknowledged cancellation_acknowledged = 18;
  }
}

message ServerToWorker {
  uint64 sequence = 1;
  uint64 acknowledges_worker_through = 2;
  // Stable across reconnects for durable assignment and cancellation messages.
  string message_id = 3;

  oneof message {
    ServerWelcome welcome = 10;
    Assignment assignment = 11;
    CancelAttempt cancel = 12;
    DrainWorker drain = 13;
    ControlAcknowledgement acknowledgement = 14;
  }
}

// Carries only the envelope's cumulative acknowledgement. It is intentionally not durable and
// does not require an acknowledgement of its own.
message ControlAcknowledgement {}

message WorkerHello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string worker_id = 3;
  string instance_id = 4;
  string worker_version = 5;
  repeated string features = 6;
  WorkerCapabilities capabilities = 7;
  repeated ActiveAttempt active_attempts = 8;
}

message WorkerCapabilities {
  Backend backend = 1;
  string architecture = 2;
  uint32 device_count = 3;
  uint32 max_concurrency = 4;
  string driver_version = 5;
  string toolkit_version = 6;
  string container_runtime = 7;
  repeated AcceleratorDevice devices = 8;
}

message AcceleratorDevice {
  string device_id = 1;
  string product_name = 2;
  string serial_number = 3;
  string firmware_version = 4;
}

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_CUDA = 1;
  BACKEND_ASCEND = 2;
}

message ActiveAttempt {
  string assignment_id = 1;
  string attempt_id = 2;
  AttemptPhase phase = 3;
}

message Heartbeat {
  repeated ActiveAttempt active_attempts = 1;
  uint32 available_slots = 2;
  WorkerHealth health = 3;
  repeated DeviceObservation devices = 4;
  repeated DeviceLease device_leases = 5;
}

message DeviceObservation {
  string device_id = 1;
  DeviceHealth health = 2;
  uint32 process_count = 3;
  uint32 utilization_percent = 4;
  uint64 memory_used_bytes = 5;
  uint64 memory_total_bytes = 6;
  uint32 temperature_millicelsius = 7;
  uint64 power_milliwatts = 8;
  uint64 observed_at_ms = 9;
  string detail = 10;
}

enum DeviceHealth {
  DEVICE_HEALTH_UNSPECIFIED = 0;
  DEVICE_HEALTH_READY = 1;
  DEVICE_HEALTH_DEGRADED = 2;
  DEVICE_HEALTH_UNHEALTHY = 3;
  DEVICE_HEALTH_RECOVERING = 4;
}

message DeviceLease {
  string attempt_id = 1;
  string device_id = 2;
  uint64 acquired_at_ms = 3;
}

enum WorkerHealth {
  WORKER_HEALTH_UNSPECIFIED = 0;
  WORKER_HEALTH_READY = 1;
  WORKER_HEALTH_DEGRADED = 2;
  WORKER_HEALTH_DRAINING = 3;
}

message WorkerStatus {
  WorkerHealth health = 1;
  string detail = 2;
}

message ServerWelcome {
  string connection_id = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
  uint64 heartbeat_interval_ms = 4;
  uint64 attempt_lease_ms = 5;
}

message Assignment {
  string assignment_id = 1;
  string attempt_id = 2;
  uint32 attempt_number = 3;
  string idempotency_key = 4;
  string task_id = 5;
  string candidate_id = 6;
  ExecutionSpec execution = 7;
  repeated string required_features = 8;
}

message ExecutionSpec {
  ExecutorKind executor_kind = 1;
  repeated string argv = 2;
  string working_directory = 3;
  repeated EnvironmentVariable environment = 4;
  uint64 timeout_ms = 5;
  ArtifactRef bundle = 6;
  ArtifactRef image = 7;
  ResourceLimits limits = 8;
}

enum ExecutorKind {
  EXECUTOR_KIND_UNSPECIFIED = 0;
  EXECUTOR_KIND_PROCESS = 1;
  EXECUTOR_KIND_CONTAINER = 2;
  EXECUTOR_KIND_SHELL = 3;
  // Policy-bound Phase 1 CUDA fixture execution. This is deliberately not a generic container
  // command: the worker must match the fixture, bundle, image, resources, and device locally.
  EXECUTOR_KIND_CUDA_FIXTURE = 4;
  // Policy-bound fixed Ascend fixture. Host device nodes, driver mounts, CANN environment, and the
  // selected device are derived exclusively from worker-local policy.
  EXECUTOR_KIND_ASCEND_FIXTURE = 5;
  EXECUTOR_KIND_ASCEND_BUILD = 6;
  // Independent reduction authority/DUT executions. Exact source and corpus bytes are carried by a
  // controller-authored reduction execution bundle; the worker chooses the trusted harness.
  EXECUTOR_KIND_CUDA_CORRECTNESS = 7;
  EXECUTOR_KIND_ASCEND_CORRECTNESS = 8;
}

message EnvironmentVariable {
  string name = 1;
  string value = 2;
}

message ArtifactRef {
  string digest = 1;
  uint64 size_bytes = 2;
  string media_type = 3;
}

message ResourceLimits {
  uint64 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint64 disk_bytes = 3;
  uint32 process_count = 4;
  uint64 output_bytes = 5;
  uint32 device_count = 6;
  NetworkPolicy network = 7;
}

enum NetworkPolicy {
  NETWORK_POLICY_UNSPECIFIED = 0;
  NETWORK_POLICY_DISABLED = 1;
  NETWORK_POLICY_DEPENDENCY_FETCH = 2;
}

message AssignmentAccepted {
  string assignment_id = 1;
  string attempt_id = 2;
  bool already_known = 3;
}

message AssignmentRejected {
  string assignment_id = 1;
  string attempt_id = 2;
  RejectionReason reason = 3;
  string detail = 4;
}

message CancellationAcknowledged {
  string assignment_id = 1;
  string attempt_id = 2;
  bool already_terminal = 3;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_INVALID = 1;
  REJECTION_REASON_UNSUPPORTED = 2;
  REJECTION_REASON_POLICY = 3;
  REJECTION_REASON_CAPACITY = 4;
  REJECTION_REASON_CONFLICT = 5;
}

message ExecutionStarted {
  string assignment_id = 1;
  string attempt_id = 2;
}

message OutputChunk {
  string attempt_id = 1;
  OutputStream stream = 2;
  uint64 byte_offset = 3;
  bytes payload = 4;
  bool display_sanitized = 5;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message ExecutionFinished {
  string assignment_id = 1;
  string attempt_id = 2;
  AttemptOutcome outcome = 3;
  optional int32 exit_code = 4;
  uint64 elapsed_ms = 5;
  ArtifactRef receipt = 6;
  ArtifactRef stdout = 7;
  ArtifactRef stderr = 8;
  string detail = 9;
}

enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  ATTEMPT_OUTCOME_SUCCEEDED = 1;
  ATTEMPT_OUTCOME_CANDIDATE_FAILED = 2;
  ATTEMPT_OUTCOME_TIMED_OUT = 3;
  ATTEMPT_OUTCOME_CANCELLED = 4;
  ATTEMPT_OUTCOME_INFRA_ERROR = 5;
  ATTEMPT_OUTCOME_INTEGRITY_VIOLATION = 6;
}

enum AttemptPhase {
  ATTEMPT_PHASE_UNSPECIFIED = 0;
  ATTEMPT_PHASE_ACCEPTED = 1;
  ATTEMPT_PHASE_RUNNING = 2;
  ATTEMPT_PHASE_FINISHED = 3;
}

message CancelAttempt {
  string attempt_id = 1;
  string reason = 2;
}

message DrainWorker {
  string reason = 1;
}
