[package]
name = "alloyport-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
alloyport-core = { path = "../alloyport-core" }
alloyport-events = { path = "../alloyport-events" }
alloyport-proto = { path = "../alloyport-proto" }
prost = "0.14.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14.6", features = ["transport"] }
