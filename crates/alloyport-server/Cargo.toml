[package]
name = "alloyport-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
alloyport-artifacts = { path = "../alloyport-artifacts" }
alloyport-core = { path = "../alloyport-core" }
alloyport-events = { path = "../alloyport-events" }
alloyport-proto = { path = "../alloyport-proto" }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["tls-ring", "transport"] }

[dev-dependencies]
alloyport-worker = { path = "../alloyport-worker" }
rcgen = "0.13.2"
tempfile = "3.27"
