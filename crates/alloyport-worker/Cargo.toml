[package]
name = "alloyport-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
alloyport-artifacts = { path = "../alloyport-artifacts" }
alloyport-core = { path = "../alloyport-core" }
alloyport-events = { path = "../alloyport-events" }
alloyport-proto = { path = "../alloyport-proto" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.54", features = ["parsing"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tonic = { version = "0.14.6", features = ["tls-ring", "transport"] }

[dev-dependencies]
tempfile = "3.27"
